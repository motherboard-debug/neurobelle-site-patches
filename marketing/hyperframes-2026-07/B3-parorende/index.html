<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Neurobelle – Bekymret for en du er glad i?</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #faeadb; }
      body { font-family: "Montserrat", "DejaVu Sans", sans-serif; }
      .serif { font-family: "Playfair Display", "DejaVu Serif", serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #faeadb; }
      .clip { position: absolute; inset: 0; }
      .stage { position: absolute; inset: 0; display: flex; flex-direction: column;
        justify-content: center; padding: 0 90px; }

      #decor .glow-a { position: absolute; border-radius: 50%; width: 880px; height: 880px;
        top: -120px; right: -260px;
        background: radial-gradient(circle, rgba(223,127,77,0.2) 0%, rgba(223,127,77,0) 70%); }
      #decor .glow-b { position: absolute; border-radius: 50%; width: 720px; height: 720px;
        bottom: -60px; left: -240px;
        background: radial-gradient(circle, rgba(220,237,227,0.6) 0%, rgba(220,237,227,0) 70%); }
      #decor .hair { position: absolute; top: 120px; left: 90px; width: 120px; height: 6px;
        background: #df7f4d; border-radius: 3px; }
      #decor .wm { position: absolute; top: 150px; left: 90px; font-size: 42px; font-weight: 700; color: #292420; }
      #decor .wm .dot { color: #b6673f; }

      /* S1 — two hearts motif */
      #s1 .stage { align-items: flex-start; }
      #hearts { width: 380px; height: 300px; margin-bottom: 60px; }
      #s1 .q { font-size: 94px; font-weight: 700; color: #292420; line-height: 1.16; }
      #s1 .q .em { color: #c87245; }

      /* S2 — observations */
      #s2 .stage { align-items: flex-start; }
      #s2 .obs { font-size: 72px; font-weight: 700; color: #292420; line-height: 1.3; }
      #s2 .obs .soft { color: #21402f; font-weight: 400; }

      /* S3 — the reframe */
      #s3 .stage { align-items: flex-start; }
      #s3 .l1 { font-size: 96px; font-weight: 700; color: #292420; line-height: 1.18; }
      #s3 .l1 .em { color: #c87245; }
      #s3 .l2 { margin-top: 44px; font-size: 52px; font-weight: 400; color: #21402f; }

      /* S4 end card */
      #s4 { background: #292420; }
      #s4 .stage { align-items: center; text-align: center; }
      #s4 .pre { font-size: 54px; font-weight: 400; color: #dcede3; margin-bottom: 40px; }
      #s4 .wm { font-size: 124px; font-weight: 700; color: #faeadb; }
      #s4 .wm .dot { color: #df7f4d; }
      #s4 .rule { width: 160px; height: 6px; background: #df7f4d; border-radius: 3px; margin: 50px 0; }
      #s4 .cta { font-size: 60px; font-weight: 700; color: #ffffff; margin-bottom: 24px; }
      #s4 .url { font-size: 38px; font-weight: 400; color: #dcede3; letter-spacing: 1px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16"
      data-width="1080" data-height="1920" data-layout-allow-overflow>

      <div id="decor" class="clip" data-start="0" data-duration="12.5" data-track-index="1">
        <div id="decor-inner" style="position:absolute; inset:0;">
          <div class="glow-a" id="glow-a"></div><div class="glow-b"></div>
          <div class="hair"></div>
          <div class="wm serif">Neurobelle<span class="dot">.</span></div>
        </div>
      </div>

      <!-- S1: 0–4 -->
      <section id="s1" class="clip" data-start="0" data-duration="4" data-track-index="2">
        <div class="stage">
          <svg id="hearts" viewBox="0 0 40 26" fill="none">
            <path d="M13 22.5S3.5 16.6 3.5 10.2C3.5 6.8 6 4.5 8.9 4.5c2 0 3.4 1.1 4.1 2.5.7-1.4 2.1-2.5 4.1-2.5 2.9 0 5.4 2.3 5.4 5.7 0 6.4-9.5 12.3-9.5 12.3z"
              stroke="#DF7F4D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M29.5 20.5S22 15.8 22 10.7c0-2.7 2-4.5 4.3-4.5 1.5 0 2.7.8 3.2 2 .5-1.2 1.7-2 3.2-2 2.3 0 4.3 1.8 4.3 4.5 0 5.1-7.5 9.8-7.5 9.8z"
              stroke="#21402F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1 class="q serif" id="s1-q">Bekymret for en<br />du er <span class="em">glad i</span>?</h1>
        </div>
      </section>

      <!-- S2: 4–7.5 -->
      <section id="s2" class="clip" data-start="4" data-duration="3.5" data-track-index="2">
        <div class="stage">
          <div class="obs serif" id="s2-o1">Glemmer mer enn før.</div>
          <div class="obs serif" id="s2-o2" style="margin-top:36px;">Mister tråden.</div>
          <div class="obs serif" id="s2-o3" style="margin-top:36px;">Blir <span class="soft">stillere.</span></div>
        </div>
      </section>

      <!-- S3: 7.5–12.5 -->
      <section id="s3" class="clip" data-start="7.5" data-duration="5" data-track-index="2">
        <div class="stage">
          <div class="l1 serif" id="s3-l1">Å ta det opp<br />er <span class="em">omsorg</span> —<br />ikke innblanding.</div>
          <div class="l2" id="s3-l2">En vurdering kan gi dere begge ro.</div>
        </div>
      </section>

      <!-- S4: 12.5–16 -->
      <section id="s4" class="clip" data-start="12.5" data-duration="3.5" data-track-index="2">
        <div class="stage">
          <div class="pre serif" id="s4-pre">Vi hjelper dere begge.</div>
          <div class="wm serif" id="s4-wm">Neurobelle<span class="dot">.</span></div>
          <div class="rule" id="s4-rule"></div>
          <div class="cta serif" id="s4-cta">Bestill time</div>
          <div class="url" id="s4-url">neurobelleklinikk.com/bestill-time</div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#glow-a", { scale: 0.9 }, { scale: 1.12, duration: 12.5, ease: "sine.inOut" }, 0);
      tl.from(["#decor .hair", "#decor .wm"], { y: -30, opacity: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 }, 0.1);

      // S1: hearts draw in softly (the smaller heart arrives second — the loved one)
      tl.from("#hearts path", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%", duration: 0.6, ease: "back.out(1.4)", stagger: 0.3 }, 0.3);
      tl.from("#s1-q", { y: 70, opacity: 0, duration: 0.65, ease: "power4.out" }, 1.0);
      tl.to("#s1 .stage", { y: -140, opacity: 0, duration: 0.45, ease: "power3.in" }, 3.55);
      tl.set("#s1 .stage", { opacity: 0 }, 4.0);

      // S2: quiet observations, one at a time
      tl.from("#s2 .stage", { y: 140, opacity: 0, duration: 0.5, ease: "power3.out" }, 4.0);
      tl.from("#s2-o1", { opacity: 0, y: 30, duration: 0.5, ease: "power3.out" }, 4.35);
      tl.from("#s2-o2", { opacity: 0, y: 30, duration: 0.5, ease: "power3.out" }, 5.15);
      tl.from("#s2-o3", { opacity: 0, y: 30, duration: 0.55, ease: "power3.out" }, 5.95);
      tl.to("#s2 .stage", { x: -200, opacity: 0, duration: 0.45, ease: "power3.in" }, 7.05);
      tl.set("#s2 .stage", { opacity: 0 }, 7.5);

      // S3: the reframe enters from right — the emotional pivot, held long
      tl.from("#s3 .stage", { x: 200, opacity: 0, duration: 0.55, ease: "power3.out" }, 7.5);
      tl.from("#s3-l1", { y: 60, opacity: 0, duration: 0.65, ease: "power3.out" }, 7.7);
      tl.from("#s3-l2", { y: 40, opacity: 0, duration: 0.55, ease: "power3.out" }, 9.2);
      tl.to("#s3 .stage", { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 12.05);
      tl.set("#s3 .stage", { opacity: 0 }, 12.5);
      tl.to("#decor-inner", { opacity: 0, duration: 0.3, ease: "power2.in" }, 12.15);
      tl.set("#decor-inner", { opacity: 0 }, 12.5);

      // S4 close
      tl.from("#s4-pre", { y: 40, opacity: 0, duration: 0.55, ease: "power3.out" }, 12.62);
      tl.from("#s4-wm", { y: 50, opacity: 0, duration: 0.6, ease: "power3.out" }, 13.0);
      tl.from("#s4-rule", { scaleX: 0, duration: 0.45, ease: "power3.out" }, 13.4);
      tl.from("#s4-cta", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 13.65);
      tl.from("#s4-url", { opacity: 0, duration: 0.5, ease: "power2.out" }, 14.0);

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
